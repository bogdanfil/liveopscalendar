<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LiveOps production and development calendar">
  <title>LiveOps Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">LO</span><span>LiveOps Calendar</span></div>
    <div class="top-actions">
      <span class="sync-pill" id="syncStatus"><span class="sync-dot"></span><span>Loading schedule</span></span>
      <a class="icon-button" id="sheetLink" href="https://docs.google.com/spreadsheets/d/1wWJXhI2wvO_BQlzvSZRov1deL7FLMMFPlqAV9dDHeqA/edit?gid=1371010002" target="_blank" rel="noreferrer" title="Open source sheet" aria-label="Open source sheet">↗</a>
    </div>
  </header>

  <main>


    <div class="legend" aria-label="Schedule visibility">
      <button id="showDevelopment" class="development-toggle" type="button" aria-pressed="false" title="Show all development: current, late, planned, and estimated">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
        Development
      </button>
      <label class="schedule-toggle prod-toggle"><input id="showProd" type="checkbox" checked><span class="checkmark">✓</span><i class="legend-line prod"></i> Production</label>
      <select id="rangePreset" aria-label="Date range preset">
        <optgroup label="Recent"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="last7">Last 7 days</option><option value="last30">Last 30 days</option><option value="last60">Last 60 days</option><option value="last90">Last 90 days</option></optgroup>
        <optgroup label="Calendar"><option value="thisMonth">This month</option><option value="lastMonth">Last month</option></optgroup>
        <optgroup label="Planning windows"><option value="cycle">Planning year</option><option value="planning6monthsForward" selected>6 months (1 before / 5 after)</option><option value="planning6months">6 months (2 before / 4 after)</option><option value="planning8months">8 months (2 before / 6 after)</option><option value="planning10months">10 months (2 before / 8 after)</option></optgroup>
        <optgroup label="Upcoming"><option value="next30">Next 30 days</option><option value="next60">Next 60 days</option><option value="next90">Next 90 days</option><option value="next6months">Next 6 months</option></optgroup>
        <option value="custom">Custom range…</option>
      </select>
      <div class="date-range" id="customDates" role="group" aria-label="Custom date range" hidden>
        <div class="date-control"><label for="rangeStart">From</label><div class="date-input"><input id="rangeStart" type="date" aria-label="Start date" required><button type="button" class="calendar-button" data-date-picker="rangeStart" aria-label="Open start date calendar" title="Choose start date"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18M7 15h3m4 0h3M7 18h3"/></svg></button></div></div>
        <div class="date-control"><label for="rangeEnd">To</label><div class="date-input"><input id="rangeEnd" type="date" aria-label="End date" required><button type="button" class="calendar-button" data-date-picker="rangeEnd" aria-label="Open end date calendar" title="Choose end date"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18M7 15h3m4 0h3M7 18h3"/></svg></button></div></div>
      </div>
      <span class="status-key"><i class="legend-icon status-red">!</i> Late</span>
      <span class="status-key"><i class="legend-icon status-grey">◷</i> Planned</span>
      <span class="status-key"><i class="legend-icon status-yellow">⚙</i> In progress</span>
      <span class="status-key"><i class="legend-icon status-green">✓</i> Done</span>
      <span><i class="missing-mark">!</i> Needs attention</span>
    </div>

    <div class="range-summary"><span id="rangeLabel"></span><span id="resultCount"></span></div>
    <section id="teamAlerts" class="team-alerts" aria-label="Late features and team overlap alerts" hidden></section>

    <section class="calendar-shell" id="calendarShell">
      <div class="empty-state" id="loadingState">Loading LiveOps data…</div>
    </section>
  </main>

  <div id="dateCalendar" class="date-calendar" role="dialog" aria-label="Choose date" hidden></div>
  <div id="featureTooltip" class="feature-tooltip" role="tooltip" hidden></div>

  <dialog id="detailDialog">
    <button class="dialog-close" aria-label="Close">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <script src="config.js"></script>
  <script src="calendar-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
